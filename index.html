<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إذاعة القرآن الكريم</title>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-91HP8NVXK5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-91HP8NVXK5');
</script>

<style>
body{
  margin:0;
  font-family: Tahoma, Arial;
  background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
  color:white;
  padding:20px;
}
.radio-box{
  max-width:420px;
  margin:30px auto;
  background: rgba(0,0,0,0.5);
  padding:30px;
  border-radius:20px;
  text-align:center;
}
.creator{
  font-size:18px;
  color:#ffd700;
  font-weight:bold;
  letter-spacing:1px;
  text-shadow: 1px 1px 2px #000;
  margin-bottom:15px;
}
.radio-icon{
  font-size:60px;
  margin-bottom:15px;
}
h1{
  font-size:26px;
  margin-bottom:15px;
}
p{
  font-size:16px;
  margin-bottom:20px;
}
button{
  width:100%;
  padding:18px;
  font-size:20px;
  border:none;
  border-radius:15px;
  background:#1abc9c;
  color:#000;
  cursor:pointer;
  font-weight: bold;
}
button:active{
  background:#16a085;
}

/* تنسيقات مؤقت النوم */
.sleep-timer-container {
  margin-top: 20px;
  padding: 15px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 12px;
}
.sleep-timer-container select {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  margin-bottom: 10px;
  background: #ffffff;
  color: #000000;
  font-family: Tahoma, Arial;
}
.sleep-btn {
  padding: 10px;
  font-size: 16px;
  background: #e67e22;
  color: #fff;
}
.sleep-btn:active {
  background: #d35400;
}
#timerStatus {
  margin-top: 10px;
  font-size: 15px;
  color: #ffd700;
  font-weight: bold;
}

#ayah{
  margin:25px auto;
  padding:15px;
  max-width:600px;
  text-align:center;
  font-size:18px;
  background:#f1f8e9;
  color:#2e7d32;
  border-radius:10px;
  font-weight:bold;
  opacity:0;
  transition: opacity 1.5s ease-in-out;
}
#fbNotice{
  display:none;
  margin-top:15px;
  padding:12px;
  background:#fff3cd;
  color:#000;
  border-radius:10px;
  font-size:14px;
  text-align:center;
  word-break:break-word;
}
#fbNotice a{
  display:block;
  margin-top:8px;
  padding:8px;
  background:#1abc9c;
  color:#000;
  text-decoration:none;
  border-radius:8px;
  font-weight:bold;
}
#copyBtn{
  display:inline-block;
  margin-top:8px;
  padding:8px 16px;
  background:#1abc9c;
  color:#000;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="radio-box">
  <div class="creator">by Mahmoud Helal</div>
  <div class="radio-icon">📻</div>
  <h1>إذاعة القرآن الكريم</h1>
  <p>استمع إلى تلاوة عطرة من كتاب الله</p>
  
  <button id="playBtn" onclick="togglePlay()">▶️ تشغيل الإذاعة</button>
  <audio id="radio" preload="none" playsinline></audio>

  <!-- مؤقت النوم -->
  <div class="sleep-timer-container">
    <select id="sleepTime">
      <option value="15">مؤقت النوم: 15 دقيقة</option>
      <option value="30">مؤقت النوم: 30 دقيقة</option>
      <option value="45">مؤقت النوم: 45 دقيقة</option>
      <option value="60">مؤقت النوم: 60 دقيقة</option>
    </select>
    <button id="sleepBtn" class="sleep-btn" onclick="toggleSleepTimer()">🌙 تفعيل مؤقت النوم</button>
    <div id="timerStatus"></div>
  </div>

  <!-- رسالة فيسبوك + رابط + زر نسخ -->
  <div id="fbNotice">
    🔊 إذا لم يعمل الصوت داخل فيسبوك<br>
    🌐 انسخ الرابط وافتحه في أي متصفح:<br>
    <a id="fbLink" href="https://mahmoudhelal310-dotcom.github.io/quran-radio/" target="_blank">https://mahmoudhelal310-dotcom.github.io/quran-radio/</a><br>
    <button id="copyBtn">نسخ الرابط</button>
  </div>

  <div id="ayah"></div>
  <p style="margin-top:20px;">🌿 صدقة جارية — لا تنسونا من صالح دعائكم</p>
</div>

<script>
/* ===== تشغيل الإذاعة ===== */
let playing = false;
const radio = document.getElementById("radio");
const btn = document.getElementById("playBtn");
const notice = document.getElementById("fbNotice");

function togglePlay(){
  if(!playing){
    if(!radio.src){
      radio.src = "https://stream.radiojar.com/8s5u5tpdtwzuv";
    }
    radio.load();
    radio.play().then(()=>{
      notice.style.display = "none";
    }).catch(()=>{
      notice.style.display = "block";
    });
    btn.innerHTML = "⏸️ إيقاف الإذاعة";
    playing = true;
  }else{
    radio.pause();
    btn.innerHTML = "▶️ تشغيل الإذاعة";
    playing = false;
  }
}

/* ===== مؤقت النوم ===== */
let sleepTimeout = null;
let countdownInterval = null;

function toggleSleepTimer() {
  const sleepBtn = document.getElementById("sleepBtn");
  const timerStatus = document.getElementById("timerStatus");

  // إذا كان المؤقت يعمل بالفعل، قم ببيانه وإلغائه
  if (sleepTimeout) {
    clearTimeout(sleepTimeout);
    clearInterval(countdownInterval);
    sleepTimeout = null;
    countdownInterval = null;
    sleepBtn.innerText = "🌙 تفعيل مؤقت النوم";
    sleepBtn.style.background = "#e67e22";
    timerStatus.innerText = "";
    return;
  }

  // إذا لم تكن الإذاعة تعمل عند تفعيل المؤقت
  if (!playing) {
    togglePlay();
  }

  const minutes = parseInt(document.getElementById("sleepTime").value);
  let totalSeconds = minutes * 60;

  sleepBtn.innerText = "❌ إلغاء مؤقت النوم";
  sleepBtn.style.background = "#e74c3c";

  function updateCountdown() {
    const mins = Math.floor(totalSeconds / 60);
    const secs = totalSeconds % 60;
    timerStatus.innerText = `سيتم إيقاف الصوت بعد: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    
    if (totalSeconds <= 0) {
      clearInterval(countdownInterval);
    }
    totalSeconds--;
  }

  updateCountdown();
  countdownInterval = setInterval(updateCountdown, 1000);

  sleepTimeout = setTimeout(() => {
    if (playing) {
      togglePlay();
    }
    clearInterval(countdownInterval);
    sleepTimeout = null;
    countdownInterval = null;
    sleepBtn.innerText = "🌙 تفعيل مؤقت النوم";
    sleepBtn.style.background = "#e67e22";
    timerStatus.innerText = "تم إيقاف الصوت بواسطة مؤقت النوم 💤";
  }, minutes * 60 * 1000);
}

/* ===== نسخ الرابط ===== */
const copyBtn = document.getElementById("copyBtn");
const fbLink = document.getElementById("fbLink");

copyBtn.addEventListener("click", () => {
  navigator.clipboard.writeText(fbLink.href).then(() => {
    copyBtn.innerText = "تم النسخ ✅";
    setTimeout(() => {
      copyBtn.innerText = "نسخ الرابط";
    }, 2000);
  }).catch(() => {
    alert("فشل النسخ، انسخ الرابط يدويًا");
  });
});

/* ===== الآيات ===== */
const ayat = [
  "﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾",
  "﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾",
  "﴿ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾",
  "﴿ فَاذْكُرُونِي أَذْكُرْكُمْ ﴾",
  "﴿ هُدًى لِلْمُتَّقِينَ ﴾",
  "﴿ وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ﴾",
  "﴿ إِنَّ هَذَا الْقُرآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾",
  "﴿ وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ ﴾",
  "﴿ إِنَّ اللَّهَ غَفُورٌ رَحِيمٌ ﴾",
  "﴿ قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَى أَنْفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ﴾",
  "﴿ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ ﴾",
  "﴿ اللَّهُ يَغْفِرُ الذُّنُوبَ جَمِيعًا ﴾",
  "﴿ وَمَا يُلْقَاهَا إِلَّا الَّذِينَ صَبَرُوا ﴾",
  "﴿ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ ﴾",
  "﴿ وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ ﴾",
  "﴿ فَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ﴾",
  "﴿ رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ ﴾",
  "﴿ كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ﴾",
  "﴿ إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ لَآيَاتٍ لِلْمُؤْمِنِينَ ﴾",
  "﴿ أَفَلَا يَنْظُرُونَ إِلَى الْإِبِلِ كَيْفَ خُلِقَتْ ﴾",
  "﴿ أَفَلَا يَتَدَبَّرُونَ الْقُرآنَ ﴾",
  "﴿ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ ﴾",
  "﴿ إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ ﴾",
  "﴿ قُلْ هُوَ اللَّهُ أَحَدٌ ﴾",
  "﴿ اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ﴾",
  "﴿ وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَى فَادْعُوهُ بِهَا ﴾"
];

let currentAyah = 0;
const ayahDiv = document.getElementById("ayah");

function changeAyah(){
  ayahDiv.style.opacity = 0;
  setTimeout(()=>{
    ayahDiv.innerHTML = "📖 " + ayat[currentAyah];
    ayahDiv.style.opacity = 1;
    currentAyah = (currentAyah + 1) % ayat.length;
  },1500);
}

changeAyah();
setInterval(changeAyah,10000);

/* ===== تسجيل Service Worker ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
    .then(() => console.log('Service Worker registered'))
    .catch((err) => console.log('Service Worker failed', err));
}
</script>

</body>
</html>
