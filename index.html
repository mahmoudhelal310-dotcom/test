<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إذاعة القرآن الكريم</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Favicon -->
<link rel="icon" href="favicon.png" type="image/png">

<!-- PWA Manifest مباشر مع description -->
<link rel="manifest" href="data:application/manifest+json,{
  \"name\": \"إذاعة القرآن الكريم\",
  \"short_name\": \"Quran Radio\",
  \"description\": \"استمع إلى تلاوات عطرة من كتاب الله الكريم مع إذاعة القرآن الكريم.\",
  \"start_url\": \"/\",
  \"display\": \"standalone\",
  \"background_color\": \"#0f2027\",
  \"theme_color\": \"#0b2e2f\",
  \"icons\": [{\"src\": \"favicon.png\", \"sizes\": \"64x64\", \"type\": \"image/png\"}]
}">

<!-- ===== Google Analytics ===== -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-91HP8NVXK5"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-91HP8NVXK5');
</script>

<style>
body{
    margin:0;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    color:white;
    padding:20px;
    min-height: 100vh;
    box-sizing: border-box;
}

.radio-box{
    max-width:420px;
    margin:20px auto;
    background: rgba(0,0,0,0.5);
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.creator{
    font-size:18px;
    color:#ffd700;
    font-weight:bold;
    letter-spacing:1px;
    text-shadow: 1px 1px 2px #000;
    margin-bottom:15px;
}

.radio-icon{
    font-size:60px;
    margin-bottom:10px;
}

/* ===== حركة تفاعلية (Equalizer) ===== */
.equalizer{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:5px;
    height:30px;
    margin:10px auto 15px;
    opacity: 0.3;
    transition: opacity 0.3s ease;
}

.equalizer.active{
    opacity: 1;
}

.equalizer span{
    width: 6px;
    background-color: #1abc9c;
    border-radius: 3px;
    height: 6px;
    transition: height 0.2s ease;
}

.equalizer.active span{
    animation: bounce 1.2s infinite ease-in-out;
}

.equalizer.active span:nth-child(1) { animation-delay: 0.1s; }
.equalizer.active span:nth-child(2) { animation-delay: 0.3s; }
.equalizer.active span:nth-child(3) { animation-delay: 0.5s; }
.equalizer.active span:nth-child(4) { animation-delay: 0.2s; }
.equalizer.active span:nth-child(5) { animation-delay: 0.4s; }

@keyframes bounce {
    0%, 100% { height: 6px; }
    50% { height: 28px; background-color: #ffd700; }
}

h1{
    font-size:26px;
    margin-bottom:10px;
}

p{
    font-size:16px;
    margin-bottom:20px;
    color: #e0e0e0;
}

button{
    width:100%;
    padding:16px;
    font-size:18px;
    font-weight:bold;
    border:none;
    border-radius:15px;
    background:#1abc9c;
    color:#000;
    cursor:pointer;
    transition: background 0.2s, transform 0.1s;
}

button:active{
    background:#16a085;
    transform: scale(0.98);
}

/* ===== التحكم في مستوى الصوت ===== */
.volume-control{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:15px 0;
    padding:10px;
    background:rgba(255,255,255,0.08);
    border-radius:12px;
}

.mute-btn{
    background:none;
    border:none;
    color:#ffd700;
    font-size:20px;
    cursor:pointer;
    padding:0;
    width:auto;
}

.volume-slider{
    flex-grow:1;
    -webkit-appearance:none;
    height:6px;
    border-radius:5px;
    background:#555;
    outline:none;
    cursor:pointer;
}

.volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#1abc9c;
    cursor:pointer;
}

.volume-slider::-moz-range-thumb{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#1abc9c;
    cursor:pointer;
}

/* ===== زر المشاركة ===== */
.share-btn{
    margin-top:12px;
    background:rgba(255,255,255,0.15);
    color:#fff;
    font-size:15px;
    padding:12px;
    border-radius:12px;
}

.share-btn:hover{
    background:rgba(255,255,255,0.25);
}

/* ===== مؤقت النوم ===== */
#sleepTimerBox{
    margin-top:15px;
    padding:10px 12px;
    background:rgba(255,255,255,0.08);
    border-radius:12px;
}

#sleepTimerBox label{
    display:block;
    font-size:14px;
    margin-bottom:8px;
    font-weight:bold;
}

#sleepTime{
    width:100%;
    padding:8px;
    font-size:14px;
    border:none;
    border-radius:7px;
    box-sizing:border-box;
    text-align:center;
    background:#fff;
    color:#222;
    font-family: inherit;
}

#startTimerBtn{
    margin-top:8px;
    padding:10px;
    font-size:14px;
    background:#f1c40f;
}

#cancelTimerBtn{
    margin-top:6px;
    padding:8px;
    font-size:13px;
    background:#e74c3c;
    color:white;
    display:none;
}

#timerDisplay{
    margin-top:8px;
    font-size:15px;
    font-weight:bold;
    color:#ffd700;
    display:none;
}

#ayah{
    margin:20px auto;
    padding:15px;
    max-width:550px;
    text-align:center;
    font-size:18px;
    background:#f1f8e9;
    color:#2e7d32;
    border-radius:10px;
    font-weight:bold;
    opacity:0;
    transition: opacity 1.5s ease-in-out;
}

#fbNotice{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#fff3cd;
    color:#000;
    border-radius:10px;
    font-size:14px;
    text-align:center;
    word-break:break-word;
}

#fbNotice a{
    display:block;
    margin-top:8px;
    padding:8px;
    background:#1abc9c;
    color:#000;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

#copyBtn{
    display:inline-block;
    margin-top:8px;
    padding:8px 16px;
    background:#1abc9c;
    color:#000;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="radio-box">
    <div class="creator">by Mahmoud Helal</div>
    <div class="radio-icon">📻</div>
    
    <!-- حركة المؤثر الصوتي (Equalizer) -->
    <div class="equalizer" id="equalizer">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <h1>إذاعة القرآن الكريم</h1>
    <p>استمع إلى تلاوة عطرة من كتاب الله</p>

    <button id="playBtn" onclick="togglePlay()">▶️ تشغيل الإذاعة</button>

    <!-- شريط التحكم بالصوت -->
    <div class="volume-control">
        <button id="muteBtn" class="mute-btn" onclick="toggleMute()" title="كتم الصوت">🔊</button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
    </div>

    <audio id="radio" preload="none" playsinline></audio>

    <!-- زر المشاركة الذكية -->
    <button class="share-btn" onclick="shareApp()">📤 مشاركة الإذاعة مع الأصدقاء</button>

    <!-- ===== مؤقت النوم ===== -->
    <div id="sleepTimerBox">
        <label>⏰ مؤقت النوم</label>
        <select id="sleepTime">
            <option value="15">15 دقيقة</option>
            <option value="30">30 دقيقة</option>
            <option value="45">45 دقيقة</option>
            <option value="60">60 دقيقة</option>
            <option value="90">90 دقيقة</option>
        </select>

        <button id="startTimerBtn" onclick="startSleepTimer()">
            ⏰ تشغيل مؤقت النوم
        </button>

        <button id="cancelTimerBtn" onclick="cancelSleepTimer()">
            ❌ إلغاء المؤقت
        </button>

        <div id="timerDisplay"></div>
    </div>

    <!-- رسالة فيسبوك + رابط + زر نسخ -->
    <div id="fbNotice">
        🔊 إذا لم يعمل الصوت داخل فيسبوك  
        🌐 انسخ الرابط وافتحه في أي متصفح:
        <br>
        <a id="fbLink" href="https://mahmoudhelal310-dotcom.github.io/quran-radio/" target="_blank">https://mahmoudhelal310-dotcom.github.io/quran-radio/</a>
        <br>
        <button id="copyBtn">نسخ الرابط</button>
    </div>
</div>

<div style="
  margin:20px auto;
  padding:12px;
  max-width:450px;
  border:1px solid #c8e6c9;
  background:#f1f8e9;
  border-radius:8px;
  text-align:center;
  font-size:17px;
  color:#2e7d32;
  font-weight:bold;
">
🌿 صدقة جارية — لا تنسونا من صالح دعائكم
</div>

<div id="ayah"></div>

<script>
/* ===== عناصر الواجهة الأساسية ===== */
let playing = false;
let previousVolume = 1;
const radio = document.getElementById("radio");
const btn = document.getElementById("playBtn");
const notice = document.getElementById("fbNotice");
const equalizer = document.getElementById("equalizer");
const volumeSlider = document.getElementById("volumeSlider");
const muteBtn = document.getElementById("muteBtn");

const STREAM_URL = "https://stream.radiojar.com/8s5u5tpdtwzuv";

/* ===== تشغيل / إيقاف الإذاعة كبث حي مباشر ===== */
function togglePlay(){
    if(!playing){
        // تعيين الرابط كبث حي مباشر بدون تأخير زمني
        radio.src = STREAM_URL;
        btn.innerHTML = "⏳ جاري التحميل...";

        radio.play().then(() => {
            notice.style.display = "none";
        }).catch(() => {
            notice.style.display = "block";
            btn.innerHTML = "▶️ تشغيل الإذاعة";
            playing = false;
            equalizer.classList.remove("active");
        });
    } else {
        radio.pause();
        radio.removeAttribute('src'); // تفريغ الرابط حتى لا يحمّل في الخلفية
        radio.load();
        btn.innerHTML = "▶️ تشغيل الإذاعة";
        playing = false;
        equalizer.classList.remove("active");
    }
}

// تشغيل الـ Equalizer وتعديل الزر فور صدور الصوت الفعلي
radio.addEventListener("playing", () => {
    btn.innerHTML = "⏸️ إيقاف الإذاعة";
    playing = true;
    equalizer.classList.add("active");
});

radio.addEventListener("waiting", () => {
    btn.innerHTML = "⏳ جاري التحميل...";
    equalizer.classList.remove("active");
});

radio.addEventListener("pause", () => {
    equalizer.classList.remove("active");
});

/* ===== التحكم بالصوت والكتم ===== */
function changeVolume(val){
    radio.volume = parseFloat(val);
    updateVolumeIcon(radio.volume);
    if(radio.volume > 0) previousVolume = radio.volume;
}

function toggleMute(){
    if(radio.volume > 0){
        previousVolume = radio.volume;
        radio.volume = 0;
        volumeSlider.value = 0;
        updateVolumeIcon(0);
    } else {
        radio.volume = previousVolume || 0.8;
        volumeSlider.value = radio.volume;
        updateVolumeIcon(radio.volume);
    }
}

function updateVolumeIcon(vol){
    if(vol === 0){
        muteBtn.innerText = "🔇";
    } else if(vol < 0.5){
        muteBtn.innerText = "🔉";
    } else {
        muteBtn.innerText = "🔊";
    }
}

/* ===== المشاركة الأصلية Web Share API ===== */
async function shareApp(){
    const shareData = {
        title: 'إذاعة القرآن الكريم',
        text: 'استمع إلى البث المباشر لإذاعة القرآن الكريم من القاهرة 🌿',
        url: window.location.href
    };

    if (navigator.share) {
        try {
            await navigator.share(shareData);
        } catch (err) {
            // تجاهل إلغاء المستخدم للنافذة
        }
    } else {
        // بديل في حال كان المتصفح لا يدعم الميزة (أجهزة الكمبيوتر القديمة)
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert("تم نسخ رابط الإذاعة بنجاح لمشاركته!");
        });
    }
}

/* ===== مؤقت النوم ===== */
let sleepTimer = null;
let sleepEndTime = null;

const sleepTime = document.getElementById("sleepTime");
const startTimerBtn = document.getElementById("startTimerBtn");
const cancelTimerBtn = document.getElementById("cancelTimerBtn");
const timerDisplay = document.getElementById("timerDisplay");

function startSleepTimer(){
    if(sleepTimer) clearInterval(sleepTimer);

    const minutes = parseInt(sleepTime.value);
    sleepEndTime = Date.now() + (minutes * 60 * 1000);

    timerDisplay.style.display = "block";
    cancelTimerBtn.style.display = "block";
    startTimerBtn.innerHTML = "⏰ إعادة ضبط المؤقت";

    updateSleepTimer();
    sleepTimer = setInterval(updateSleepTimer, 1000);
}

function updateSleepTimer(){
    const remaining = sleepEndTime - Date.now();

    if(remaining <= 0){
        clearInterval(sleepTimer);
        sleepTimer = null;

        // إيقاف الإذاعة وتفريغها بهدوء
        radio.pause();
        radio.removeAttribute('src');
        radio.load();

        btn.innerHTML = "▶️ تشغيل الإذاعة";
        playing = false;
        equalizer.classList.remove("active");

        timerDisplay.style.display = "none";
        cancelTimerBtn.style.display = "none";
        startTimerBtn.innerHTML = "⏰ تشغيل مؤقت النوم";
        return;
    }

    const totalSeconds = Math.ceil(remaining / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    let text = "⏰ متبقي: ";
    if(hours > 0) text += hours + " ساعة ";
    text += String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");

    timerDisplay.innerHTML = text;
}

function cancelSleepTimer(){
    if(sleepTimer){
        clearInterval(sleepTimer);
        sleepTimer = null;
    }
    sleepEndTime = null;
    timerDisplay.style.display = "none";
    cancelTimerBtn.style.display = "none";
    startTimerBtn.innerHTML = "⏰ تشغيل مؤقت النوم";
}

/* ===== نسخ الرابط يدوياً لمتصفح فيسبوك ===== */
const copyBtn = document.getElementById("copyBtn");
const fbLink = document.getElementById("fbLink");

copyBtn.addEventListener("click", () => {
    navigator.clipboard.writeText(fbLink.href).then(() => {
        copyBtn.innerText = "تم النسخ ✅";
        setTimeout(() => { copyBtn.innerText = "نسخ الرابط"; }, 2000);
    }).catch(() => {
        alert("فشل النسخ، انسخ الرابط يدويًا");
    });
});

/* ===== تبديل الآيات ===== */
const ayat = [
"﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾",
"﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾",
"﴿ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾",
"﴿ فَاذْكُرُونِي أَذْكُرْكُمْ ﴾",
"﴿ وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ﴾",
"﴿ إِنَّ هَذَا الْقُرآنَ يَهْدِي لِلَّتِي هِيَ أَقْوَمُ ﴾",
"﴿ وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ ﴾",
"﴿ رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ ﴾",
"﴿ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ ﴾",
"﴿ قُلْ هُوَ اللَّهُ أَحَدٌ ﴾",
"﴿ اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ﴾"
];

let currentAyah = 0;
const ayahDiv = document.getElementById("ayah");

function changeAyah(){
    ayahDiv.style.opacity = 0;
    setTimeout(() => {
        ayahDiv.innerHTML = "📖 " + ayat[currentAyah];
        ayahDiv.style.opacity = 1;
        currentAyah = (currentAyah + 1) % ayat.length;
    }, 1500);
}

changeAyah();
setInterval(changeAyah, 10000);

/* ===== تسجيل Service Worker ===== */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js')
  .then(() => console.log('Service Worker registered'))
  .catch((err) => console.log('Service Worker failed', err));
}
</script>

</body>
</html>
